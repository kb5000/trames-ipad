name: Trames
options:
  developmentLanguage: en
  knownRegions: [en, zh-Hans]
  bundleIdPrefix: org.trames
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '2'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: YES
    LIBRARY_SEARCH_PATHS: ['$(inherited)', '$(SRCROOT)/../../target/ios-link/$(TRAMES_RUST_TARGET)']
    'TRAMES_RUST_TARGET[sdk=iphoneos*]': aarch64-apple-ios
    'TRAMES_RUST_TARGET[sdk=iphonesimulator*]': aarch64-apple-ios-sim
    MARKETING_VERSION: '1.5.4'
    CURRENT_PROJECT_VERSION: '49'
    TRAMES_APP_GROUP: group.org.trames.Trames
    INFOPLIST_KEY_CFBundleShortVersionString: '$(MARKETING_VERSION)'
    INFOPLIST_KEY_CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
    INFOPLIST_KEY_CFBundleDisplayName: Trames
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: Allow Linux applications to connect to services on your local network.
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    CODE_SIGN_STYLE: Automatic
packages:
  TramesKit:
    path: TramesKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.20.0
targets:
  Trames:
    type: application
    platform: iOS
    preBuildScripts:
      - name: Validate guest graphics resources
        script: |
          cd "$SRCROOT/../.."
          python3 scripts/check-ios-guest.py --video-dir apps/ios/Trames/GuestVideo --rust-dir "${TRAMES_RUST_LIB_DIR:-$PWD/target/ios-link/$TRAMES_RUST_TARGET}"
        basedOnDependencyAnalysis: false
    sources:
      - path: Trames
        excludes: [GuestMusl, GuestVulkan, GuestVideo]
      - path: TramesFileSystem
      - path: Trames/GuestMusl
        type: folder
        buildPhase: resources
      - path: Trames/GuestVulkan
        type: folder
        buildPhase: resources
      - path: Trames/GuestVideo
        type: folder
        buildPhase: resources
    dependencies:
      - package: TramesKit
      - package: SwiftTerm
      - target: TramesFileProvider
        embed: true
      - sdk: FileProvider.framework
      # A Rust staticlib bundles MoltenVK's objects, but its system link flags
      # do not propagate to Xcode's final Swift executable link.
      - sdk: Metal.framework
      - sdk: Foundation.framework
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreVideo.framework
      - sdk: CoreMedia.framework
      - sdk: VideoToolbox.framework
      - sdk: AudioToolbox.framework
      - sdk: AVKit.framework
      - sdk: AVFoundation.framework
      - sdk: MetalPerformanceShaders.framework
      - sdk: UIKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.trames.Trames
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Trames-Info.plist
        CODE_SIGN_ENTITLEMENTS: Trames.entitlements
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        LIBRARY_SEARCH_PATHS: ['$(inherited)', '$(SRCROOT)/../../target/ios-link/$(TRAMES_RUST_TARGET)']
        'TRAMES_RUST_TARGET[sdk=iphoneos*]': aarch64-apple-ios
        'TRAMES_RUST_TARGET[sdk=iphonesimulator*]': aarch64-apple-ios-sim
        OTHER_LDFLAGS: ['$(inherited)', '-ltrames_ffi', '-lresolv', '-lc++']
  TramesFileProvider:
    type: app-extension
    platform: iOS
    sources: [TramesFileProvider,TramesFileSystem]
    dependencies:
      - sdk: FileProvider.framework
      - sdk: UniformTypeIdentifiers.framework
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TramesFileProvider/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: org.trames.Trames.FileProvider
        CODE_SIGN_ENTITLEMENTS: Trames.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
  TramesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TramesTests
        excludes: [Fixtures]
      - path: TramesTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Trames
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.trames.TramesTests
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
  TramesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TramesUITests]
    dependencies:
      - target: Trames
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.trames.TramesUITests
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
schemes:
  Trames:
    build:
      targets:
        Trames: all
    test:
      targets: [TramesTests, TramesUITests]
    run:
      config: Debug
