name: Linux runtime
on:
  push:
    branches: [main]
    paths-ignore: ['apps/ios/**', 'docs/**', '.github/workflows/ios.yml', 'scripts/ios-ci-scope.py', '.github/workflows/linux.yml', '.github/ios-validation-plan.json', 'scripts/publish-ios-build35.py', '.github/workflows/publish-ios-build35.yml']
  pull_request:
    paths-ignore: ['apps/ios/**', 'docs/**', '.github/workflows/ios.yml', 'scripts/ios-ci-scope.py', '.github/workflows/linux.yml', '.github/ios-validation-plan.json', 'scripts/publish-ios-build35.py', '.github/workflows/publish-ios-build35.yml']
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      frontend_only: ${{ steps.scope.outputs.frontend_only }}
      targeted: ${{ steps.scope.outputs.targeted }}
      skip_native: ${{ steps.scope.outputs.skip_linux_native }}
      skip_modules: ${{ steps.scope.outputs.skip_linux_modules }}
      native_scope: ${{ steps.scope.outputs.native_scope }}
      firefox_memory_apple_retry: ${{ steps.scope.outputs.firefox_memory_apple_retry }}
      firefox_memory_retry_run: ${{ steps.scope.outputs.firefox_memory_retry_run }}
      firefox_memory_readonly_followup: ${{ steps.scope.outputs.firefox_memory_readonly_followup }}
      runtime_linux_reused: ${{ steps.scope.outputs.runtime_linux_reused }}
      storage_proc_only: ${{ steps.scope.outputs.storage_proc_only }}
      isolation_retry: ${{ steps.scope.outputs.isolation_retry }}
      network_retry: ${{ steps.scope.outputs.network_retry }}
      docker_bridge: ${{ steps.scope.outputs.docker_bridge }}
      nftables: ${{ steps.scope.outputs.nftables }}
      docker_network: ${{ steps.scope.outputs.docker_network }}
      docker_network_retry: ${{ steps.scope.outputs.docker_network_retry }}
      docker_network_virtual_retry: ${{ steps.scope.outputs.docker_network_virtual_retry }}
      docker_default_remount: ${{ steps.scope.outputs.docker_default_remount }}
      zink_skip_linux_checks: ${{ steps.scope.outputs.zink_skip_linux_checks }}
      zink_sync_skip_linux: ${{ steps.scope.outputs.zink_sync_skip_linux }}
      zink_egl_only: ${{ steps.scope.outputs.zink_egl_only }}
      zink_egl_skip_apple_checks: ${{ steps.scope.outputs.zink_egl_skip_apple_checks }}
      zink_wayland_linux_run: ${{ steps.scope.outputs.zink_wayland_linux_run }}
      zink_wayland_linux_sha: ${{ steps.scope.outputs.zink_wayland_linux_sha }}
      zink_mrt_only: ${{ steps.scope.outputs.zink_mrt_only }}
      zink_feedback_only: ${{ steps.scope.outputs.zink_feedback_only }}
      zink_tf_only: ${{ steps.scope.outputs.zink_tf_only }}
      zink_tf_cache_only: ${{ steps.scope.outputs.zink_tf_cache_only }}
      zink_stencil_only: ${{ steps.scope.outputs.zink_stencil_only }}
      zink_divisor_only: ${{ steps.scope.outputs.zink_divisor_only }}
      zink_mesa_only: ${{ steps.scope.outputs.zink_mesa_only }}
      zink_guest_bundle_run: ${{ steps.scope.outputs.zink_guest_bundle_run }}
      zink_guest_bundle_sha: ${{ steps.scope.outputs.zink_guest_bundle_sha }}
      tf_shader_bundle_run: ${{ steps.scope.outputs.tf_shader_bundle_run }}
      tf_shader_bundle_sha: ${{ steps.scope.outputs.tf_shader_bundle_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          TRAMES_FULL_CHECK: 'false'
          TRAMES_VALIDATION_WORKFLOW: linux.yml
          TRAMES_NEEDS_GUEST_ARTIFACTS: 'false'
        run: python3 scripts/ios-ci-scope.py
  vulkan-tf-engine-linux:
    needs: scope
    if: needs.scope.outputs.native_scope == 'vulkan-tf-engine'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        if: needs.scope.outputs.tf_shader_bundle_run != ''
        with:
          name: vulkan-native-tf-shaders
          path: target/native-tf-reuse
          run-id: ${{ needs.scope.outputs.tf_shader_bundle_run }}
          github-token: ${{ github.token }}
      - name: Verify original compiler layouts and independent Vulkan primitive reference
        run: |
          sudo apt-get update
          sudo apt-get install --yes glslang-tools libvulkan-dev mesa-vulkan-drivers
          set -o pipefail
          export VK_DRIVER_FILES="$(python3 -c 'from pathlib import Path; print(next(Path("/usr/share/vulkan/icd.d").glob("*lvp*")))')"
          export LP_NUM_THREADS=2
          if [[ -n '${{ needs.scope.outputs.tf_shader_bundle_run }}' ]]; then
            python3 tests/integration/vulkan-native-tf-reference.py \
              --reuse-shaders target/native-tf-reuse/target/vulkan-native-tf \
              --reuse-run '${{ needs.scope.outputs.tf_shader_bundle_run }}' \
              --reuse-sha '${{ needs.scope.outputs.tf_shader_bundle_sha }}' | tee target-native-tf-linux.log
          else
            python3 scripts/build-vulkan-native-tf.py | tee target-native-tf-linux.log
            python3 tests/integration/vulkan-native-tf-reference.py | tee -a target-native-tf-linux.log
          fi
          python3 -m py_compile scripts/build-vulkan-native-tf.py scripts/ios-ci-scope.py scripts/prepare-vulkan.py tests/integration/vulkan-native-tf-reference.py
      - uses: actions/upload-artifact@v4
        with:
          name: vulkan-native-tf-shaders
          path: |
            target/vulkan-native-tf/*.metal
            target/vulkan-native-tf/*.json
            target/vulkan-native-tf/*.spv
            target-native-tf-linux.log
          retention-days: 7
  vulkan-tf-engine-apple:
    needs: [scope, vulkan-tf-engine-linux]
    if: needs.scope.outputs.native_scope == 'vulkan-tf-engine'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: vulkan-native-tf-shaders
          path: target/native-tf-input
      - name: Verify exact original compiler and generated GPU shader inputs
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('target/native-tf-input/target/vulkan-native-tf')
          record=json.loads((root/'build.json').read_text())
          pinned=json.loads(Path('scripts/vulkan-upstream.json').read_text())['archives']['moltenvk-dependency-SPIRV-Cross.tar.gz']['sha256']
          assert record['upstream_sha256']==pinned
          for path,expected in record['inputs'].items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==expected,path
          for path,expected in record['shaders'].items():
              assert hashlib.sha256((root/path).read_bytes()).hexdigest()==expected,path
          print('Exact unmodified SPIRV-Cross/source/shader hashes verified; no guest capability advertised')
          PY
      - name: Execute native Metal TF data, counters, overflow and raster replay
        run: |
          mkdir -p target/native-tf-evidence
          native=runtime/crates/trames-vulkan/native/transform-feedback
          xcrun clang++ -std=c++14 -O2 -Wall -Wextra -Werror -fobjc-arc -I"$native" \
            "$native/metal.mm" tests/fixtures/vulkan-native-tf-metal.mm \
            -framework Metal -framework Foundation -o target/native-tf-evidence/metal-tf
          set -o pipefail
          target/native-tf-evidence/metal-tf target/native-tf-input/target/vulkan-native-tf "$native/assemble.metal" | tee target/native-tf-evidence/gpu.log
      - name: Compile same native engine and generated shaders for arm64 iOS
        run: |
          native=runtime/crates/trames-vulkan/native/transform-feedback
          xcrun --sdk iphoneos clang++ -target arm64-apple-ios15.0 -std=c++14 -O2 -Wall -Wextra -Werror -fobjc-arc \
            -I"$native" -c "$native/metal.mm" -o target/native-tf-evidence/engine-ios.o
          for shader in target/native-tf-input/target/vulkan-native-tf/*.metal; do
            name=$(basename "$shader" .metal)
            cat "$shader" "$native/assemble.metal" > "target/native-tf-evidence/$name.metal"
            xcrun --sdk iphoneos metal -std=ios-metal2.3 -c "target/native-tf-evidence/$name.metal" -o "target/native-tf-evidence/$name.air"
          done
          xcodebuild -version > target/native-tf-evidence/toolchain.txt
          xcrun --sdk iphoneos --show-sdk-version >> target/native-tf-evidence/toolchain.txt
          shasum -a 256 target/native-tf-evidence/* > target/native-tf-evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulkan-native-tf-metal
          path: target/native-tf-evidence/
          retention-days: 7
  firefox-memory:
    needs: scope
    if: needs.scope.outputs.native_scope == 'firefox-memory' && needs.scope.outputs.firefox_memory_apple_retry != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
          components: rustfmt, clippy, rust-src
      - name: Check unchanged original-musl fixture sources
        run: |
          git fetch --depth=1 origin 145db7629ce29fd1780619f20dbffee3a24418b9
          git diff --exit-code 145db7629ce29fd1780619f20dbffee3a24418b9 HEAD -- tests/fixtures/firefox-memory-probe.c scripts/build-firefox-fixture.sh
      - uses: actions/download-artifact@v4
        with:
          name: firefox-memory-fixture
          path: target/firefox-fixture/
          github-token: ${{ github.token }}
          run-id: 39381684188
      - name: Check affected memory paths and original ARM64 ABI
        run: |
          cargo fmt --all --check
          if [[ '${{ needs.scope.outputs.firefox_memory_readonly_followup }}' == true ]]; then
            cargo clippy -p trames-memory -p trames-core --all-targets --no-deps --locked -- -D warnings
            cargo test -p trames-core --lib --tests --locked
            CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo test --manifest-path runtime/Cargo.toml -p trames-memory --lib --locked parallel::readonly
          else
            cargo clippy -p trames-memory -p trames-core -p trames-vfs --all-targets --no-deps --locked -- -D warnings
            cargo test -p trames-memory -p trames-core -p trames-linux --lib --tests --locked
            CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo test --manifest-path runtime/Cargo.toml -p trames-vfs mapped --lib --locked
          fi
          cargo build -p trames-cli --release --locked
          python3 -m py_compile tests/integration/firefox.py scripts/ios-ci-scope.py
          if [[ '${{ needs.scope.outputs.firefox_memory_readonly_followup }}' != true ]]; then
            cc -O2 -Wall -Wextra -Werror tests/fixtures/firefox-memory-probe.c -o /tmp/memory-probe
            /tmp/memory-probe
            CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo run --manifest-path runtime/Cargo.toml --release -p trames-memory --example shared-readonly -- 3 | tee target/shared-readonly-linux.log
          fi
          target/release/trames-run --memory --memory-budget 4GiB --process-memory-budget 4GiB --cpus 4 target/firefox-fixture/memory-probe
      - name: Check shared CPU/native byte ownership with ThreadSanitizer
        env:
          RUSTC_BOOTSTRAP: '1'
          RUSTFLAGS: '-Zsanitizer=thread'
          CARGO_TARGET_DIR: target/shared-memory-tsan
        run: |
          if [[ '${{ needs.scope.outputs.firefox_memory_readonly_followup }}' != true ]]; then
            CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo test --manifest-path runtime/Cargo.toml -Zbuild-std -p trames-memory --target x86_64-unknown-linux-gnu --locked --lib parallel::sharing
            CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo test --manifest-path runtime/Cargo.toml -Zbuild-std -p trames-memory --target x86_64-unknown-linux-gnu --locked --lib parallel::page
            CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo test --manifest-path runtime/Cargo.toml -Zbuild-std -p trames-memory --target x86_64-unknown-linux-gnu --locked --lib parallel::exclusive
          fi
          CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo test --manifest-path runtime/Cargo.toml -Zbuild-std -p trames-memory --target x86_64-unknown-linux-gnu --locked --lib parallel::readonly
          CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo test --manifest-path runtime/Cargo.toml -Zbuild-std -p trames-vfs --target x86_64-unknown-linux-gnu --locked --lib mapped::tests::workers_share_file_and_memfd
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-memory-fixture
          path: target/firefox-fixture/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: needs.scope.outputs.firefox_memory_readonly_followup != 'true'
        with:
          name: shared-readonly-linux
          path: target/shared-readonly-linux.log
          retention-days: 7
  firefox-memory-apple:
    needs: [scope, firefox-memory]
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.native_scope == 'firefox-memory' && (needs.firefox-memory.result == 'success' || needs.scope.outputs.firefox_memory_apple_retry == 'true') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
      - uses: actions/download-artifact@v4
        with:
          name: firefox-memory-fixture
          path: target/firefox-fixture/
          github-token: ${{ github.token }}
          run-id: ${{ needs.scope.outputs.firefox_memory_apple_retry == 'true' && needs.scope.outputs.firefox_memory_retry_run || github.run_id }}
      - name: Verify demand-zero paths on Apple ARM64 with 16KiB pages
        run: |
          uname -m
          sysctl hw.pagesize
          if [[ '${{ needs.scope.outputs.firefox_memory_apple_retry }}' == true ]]; then
            CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo test --manifest-path runtime/Cargo.toml -p trames-linux --lib --locked network::tests::invalid_accept_destination_does_not_drop_queued_connection -- --exact
            CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo test --manifest-path runtime/Cargo.toml -p trames-memory --lib --locked
          else
            cargo test -p trames-memory -p trames-core -p trames-linux --lib --tests --locked
          fi
          CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo test --manifest-path runtime/Cargo.toml -p trames-vfs mapped --lib --locked
          cargo build -p trames-cli --release --locked
          target/release/trames-run --memory --memory-budget 4GiB --process-memory-budget 4GiB --cpus 4 target/firefox-fixture/memory-probe
          CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo run --manifest-path runtime/Cargo.toml --release -p trames-memory --example shared-readonly -- 3 | tee target/shared-readonly-apple.log
      - uses: actions/upload-artifact@v4
        with:
          name: shared-readonly-apple
          path: target/shared-readonly-apple.log
          retention-days: 7
  firefox-layout:
    needs: scope
    if: needs.scope.outputs.native_scope == 'firefox-layout' || needs.scope.outputs.native_scope == 'firefox-mmu-cap'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
          components: rustfmt, clippy
      - name: Check reservation and ordinary mapping layout
        run: |
          cargo fmt --all --check
          if [[ '${{ needs.scope.outputs.native_scope }}' == firefox-mmu-cap ]]; then
            CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo clippy --manifest-path runtime/Cargo.toml -p trames-memory --all-targets --no-deps --locked -- -D warnings
            CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo test --manifest-path runtime/Cargo.toml -p trames-memory --release --lib --locked
          else
            CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo clippy --manifest-path runtime/Cargo.toml -p trames-linux --all-targets --no-deps --locked -- -D warnings
            CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo test --manifest-path runtime/Cargo.toml -p trames-linux state::tests:: --release --lib --locked
          fi
          python3 -m py_compile tests/integration/firefox.py scripts/ios-ci-scope.py
  firefox-layout-apple:
    needs: [scope, firefox-layout]
    if: needs.scope.outputs.native_scope == 'firefox-layout' || needs.scope.outputs.native_scope == 'firefox-mmu-cap'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
          targets: aarch64-apple-ios
      - name: Verify Apple ARM64 mapping layout and iOS embedding
        run: |
          uname -m
          sysctl hw.pagesize
          if [[ '${{ needs.scope.outputs.native_scope }}' == firefox-mmu-cap ]]; then
            CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo test --manifest-path runtime/Cargo.toml -p trames-memory --release --lib --locked
          else
            CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo test --manifest-path runtime/Cargo.toml -p trames-linux state::tests:: --release --lib --locked
          fi
          cargo check -p trames-ffi --target aarch64-apple-ios --locked
  firefox-runtime:
    needs: scope
    if: needs.scope.outputs.native_scope == 'firefox-runtime'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
          components: rustfmt, clippy
      - name: Check unchanged original-musl fixture sources
        run: |
          git fetch --depth=1 origin c7e9c39ee02c2adfecead1157d041201365a5113
          git diff --exit-code c7e9c39ee02c2adfecead1157d041201365a5113 HEAD -- tests/fixtures/firefox-socket-probe.c tests/fixtures/firefox-memory-probe.c scripts/build-firefox-fixture.sh
      - uses: actions/download-artifact@v4
        with:
          name: firefox-memory-fixture
          path: target/firefox-fixture/
          github-token: ${{ github.token }}
          run-id: 39400045425
      - name: Check affected runtime modules and socket ABI
        run: |
          cargo fmt --all --check
          cargo clippy -p trames-vfs -p trames-linux -p trames-core -p trames-memory --all-targets --no-deps --locked -- -D warnings
          cargo test -p trames-core -p trames-memory --lib --tests --locked
          CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo test --manifest-path runtime/Cargo.toml -p trames-vfs clone_resources --lib --locked
          CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo test --manifest-path runtime/Cargo.toml -p trames-vfs process_tests --lib --locked
          CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo test --manifest-path runtime/Cargo.toml -p trames-vfs mapped --lib --locked
          cargo build -p trames-cli --release --locked
          python3 -m py_compile tests/integration/firefox.py tests/integration/firefox-prepare.py scripts/ios-ci-scope.py
          target/release/trames-run --memory "$PWD/target/firefox-fixture/socket-probe"
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-socket-fixture
          path: target/firefox-fixture/
          retention-days: 7
  firefox-runtime-apple:
    needs: [scope, firefox-runtime]
    if: needs.scope.outputs.native_scope == 'firefox-runtime'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
      - uses: actions/download-artifact@v4
        with:
          name: firefox-socket-fixture
          path: target/firefox-fixture/
      - name: Verify Apple ARM64 runtime and socket ABI
        run: |
          uname -m
          sysctl hw.pagesize
          cargo test -p trames-core -p trames-memory --lib --tests --locked
          CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo test --manifest-path runtime/Cargo.toml -p trames-vfs clone_resources --lib --locked
          CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo test --manifest-path runtime/Cargo.toml -p trames-vfs process_tests --lib --locked
          CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo test --manifest-path runtime/Cargo.toml -p trames-vfs mapped --lib --locked
          cargo build -p trames-cli --release --locked
          target/release/trames-run --memory "$PWD/target/firefox-fixture/socket-probe"
  firefox-clock:
    needs: scope
    if: needs.scope.outputs.native_scope == 'firefox-clock'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
          components: rustfmt, clippy
      - uses: actions/download-artifact@v4
        with:
          name: firefox-memory-fixture
          path: target/firefox-fixture/
          github-token: ${{ github.token }}
          run-id: 39400045425
      - name: Build only the new original-musl clock fixture
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu
          bash scripts/build-firefox-clock-fixture.sh
          cp target/firefox-fixture/musl-COPYRIGHT target/firefox-fixture/musl-1.2.5.tar.gz target/firefox-clock-fixture/
      - name: Check changed Core paths and clock ABI
        run: |
          cargo fmt --all --check
          cargo clippy -p trames-core --all-targets --no-deps --locked -- -D warnings
          cargo test -p trames-core --lib --tests --locked
          cargo build -p trames-cli --release --locked
          python3 -m py_compile tests/integration/firefox.py scripts/ios-ci-scope.py
          cc -O2 -Wall -Wextra -Werror -pthread tests/fixtures/firefox-clock-probe.c -o /tmp/clock-probe
          /tmp/clock-probe
          target/release/trames-run --memory --cpus 1 target/firefox-clock-fixture/clock-probe
          target/release/trames-run --memory --cpus 4 target/firefox-clock-fixture/clock-probe
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-clock-fixture
          path: target/firefox-clock-fixture/
          retention-days: 7
  firefox-clock-apple:
    needs: [scope, firefox-clock]
    if: needs.scope.outputs.native_scope == 'firefox-clock'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
      - uses: actions/download-artifact@v4
        with:
          name: firefox-clock-fixture
          path: target/firefox-clock-fixture/
      - name: Verify Apple ARM64 coordinator and original musl clocks
        run: |
          uname -m
          sysctl hw.pagesize
          cargo test -p trames-core --lib --tests --locked
          cargo build -p trames-cli --release --locked
          target/release/trames-run --memory --cpus 1 target/firefox-clock-fixture/clock-probe
          target/release/trames-run --memory --cpus 4 target/firefox-clock-fixture/clock-probe
  compatibility-probe:
    needs: scope
    if: needs.scope.outputs.native_scope == 'compatibility-probe'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check Firefox diagnostic scripts and Linux socket oracle
        run: |
          python3 -m py_compile tests/integration/firefox.py tests/integration/firefox-prepare.py scripts/ios-ci-scope.py
          python3 tests/integration/firefox.py --help
          python3 tests/integration/firefox-prepare.py --help
          cc -O2 -Wall -Wextra -Werror tests/fixtures/firefox-socket-probe.c -o /tmp/firefox-socket-probe
          /tmp/firefox-socket-probe
  zink-wayland-linux:
    needs: scope
    if: needs.scope.outputs.native_scope == 'zink-wayland' && needs.scope.outputs.zink_wayland_linux_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
          components: rustfmt, clippy
      - name: Prepare original signed Mesa and Wayland EGL clients
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-14-aarch64-linux-gnu g++-14-aarch64-linux-gnu libvulkan-dev mesa-vulkan-drivers libwayland-bin glslang-tools pkg-config bison flex ninja-build python3-venv patch
          bash scripts/build-vulkan-guest.sh
          python3 scripts/prepare-zink-guest.py --wayland
          python3 -m venv target/mesa-tools
          target/mesa-tools/bin/pip install -r scripts/zink-egl-requirements.txt
          export PATH="$PWD/target/mesa-tools/bin:$PATH"
          python3 scripts/build-zink-egl.py
      - name: Check affected Vulkan module and build production embedding
        run: |
          cargo fmt --all --check
          if [[ '${{ needs.scope.outputs.zink_egl_only }}' != true ]] && ! python3 -c 'import json; assert json.load(open(".github/ios-validation-plan.json")).get("zink_present_damage_reuse")'; then
            CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo clippy --manifest-path runtime/Cargo.toml -p trames-vulkan --all-targets --locked -- -D warnings
            CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo test --manifest-path runtime/Cargo.toml -p trames-vulkan --lib --locked
          fi
          if ! python3 -c 'import json; p=json.load(open(".github/ios-validation-plan.json")); assert p.get("zink_attachment_clear_reuse") or p.get("zink_gpu_budget_reuse")'; then
            modules='-p trames-wayland -p trames-vfs'
            if python3 -c 'import json; p=json.load(open(".github/ios-validation-plan.json")); assert p.get("zink_present_damage_reuse") or p.get("zink_frame_boundaries_reuse")'; then modules='-p trames-wayland'; fi
            cargo clippy $modules --all-targets --no-deps --locked -- -D warnings
            CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo test --manifest-path runtime/Cargo.toml -p trames-wayland --lib --locked
          fi
          cargo clippy -p trames-distro -p trames-ffi --all-targets --no-deps --locked -- -D warnings
          CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo test --manifest-path runtime/Cargo.toml -p trames-distro vulkan --locked
          cargo build -p trames-cli -p trames-ffi --release --locked
          python3 -m py_compile scripts/prepare-zink-guest.py scripts/prepare-zink-native-bundle.py tests/integration/zink-wayland.py
      - name: Verify GPU image copies and original Mesa window lifecycle
        run: |
          export VK_DRIVER_FILES="$(python3 -c 'from pathlib import Path; print(next(Path("/usr/share/vulkan/icd.d").glob("*lvp*")))')"
          export TRAMES_ZINK_CPU_REFERENCE=1
          mkdir -p target/zink-wayland-native
          mode=--relay
          if python3 -c 'import json; assert json.load(open(".github/ios-validation-plan.json")).get("zink_attachment_clear_reuse")'; then
            mode=--clear-only
          elif python3 -c 'import json; assert json.load(open(".github/ios-validation-plan.json")).get("zink_present_damage_reuse")'; then
            mode=--damage-only
          elif python3 -c 'import json; assert json.load(open(".github/ios-validation-plan.json")).get("zink_gpu_budget_reuse")'; then
            mode=--budget-only
          elif python3 -c 'import json; assert json.load(open(".github/ios-validation-plan.json")).get("zink_frame_boundaries_reuse")'; then
            mode=--frame-boundaries-only
          else
            target/zink-inputs/vulkan-copy-host | tee target/zink-wayland-native/image-copy.log
          fi
          python3 tests/integration/zink-wayland.py "$mode" --output target/zink-wayland --snapshot-store target/zink-native-bundle/store
          python3 scripts/prepare-zink-native-bundle.py --wayland
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zink-wayland-evidence
          path: |
            target/zink-wayland/*.json
            target/zink-wayland/*.log
            target/zink-wayland/*.stdout
            target/zink-wayland/*.stderr
            target/zink-wayland-native/
            target/zink-inputs/inputs.json
            target/vulkan-guest/manifest.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: zink-native-bundle
          path: target/zink-native-bundle/
          include-hidden-files: true
          retention-days: 3
