                python3 tests/integration/vulkan-divisor.py --store target/zink-native-bundle/store --output target/vulkan-divisor-linux --native-client target/zink-inputs/vulkan-divisor-host
                python3 tests/integration/zink-es3.py --store target/zink-native-bundle/store --output target/zink-divisor-instancing-linux --stage instancing
                python3 tests/integration/zink-es3.py --store target/zink-native-bundle/store --output target/zink-divisor-capabilities-linux --stage capabilities
                python3 tests/integration/zink-es3.py --store target/zink-native-bundle/store --output target/zink-divisor-es3-linux --stage es3
