            CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo run --manifest-path runtime/Cargo.toml -p trames-vulkan --example resources --release --locked -- tests/fixtures/bin/vulkan-resources.spv
            CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo run --manifest-path runtime/Cargo.toml -p trames-vulkan --example lifecycle --release --locked -- tests/fixtures/bin/vulkan-compute.spv tests/fixtures/bin/vulkan-render.vert.spv tests/fixtures/bin/vulkan-render.frag.spv
          fi
      - name: Validate query and template foundation and retain actual Mesa outcome
