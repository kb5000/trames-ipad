              if [[ '${{ needs.scope.outputs.zink_feedback_only }}' == true || '${{ needs.scope.outputs.zink_stencil_only }}' == true || '${{ needs.scope.outputs.zink_divisor_only }}' == true ]]; then
                python3 tests/integration/zink-foundation.py --bootstrap-only --snapshot-store target/zink-native-bundle/store
              else
