                python3 tests/integration/zink-es3.py --store target/zink-native-bundle/store --output target/zink-stencil-capabilities-linux --stage capabilities
                python3 tests/integration/zink-es3.py --store target/zink-native-bundle/store --output target/zink-stencil-es3-linux --stage es3 --capability-probe
              else
                python3 tests/integration/vulkan-feedback.py --store target/zink-native-bundle/store --output target/vulkan-feedback-linux --require-feedback --native-client target/zink-inputs/vulkan-feedback-host
              fi
              python3 scripts/prepare-zink-native-bundle.py --es3
            else
              python3 tests/integration/zink-foundation.py --require-render --snapshot-store target/zink-native-bundle/store
              python3 scripts/prepare-zink-native-bundle.py
