            echo 'Reuse passed exact-source Rust/ICD and iOS FFI checks; compile changed native GPU source below.'
          elif [[ '${{ needs.scope.outputs.zink_feedback_only }}' == true ]]; then
            CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo clippy --manifest-path runtime/Cargo.toml -p trames-vulkan --example feedback --locked -- -D warnings
          else
            CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo clippy --manifest-path runtime/Cargo.toml -p trames-vulkan --all-targets --locked -- -D warnings
            CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}" cargo test --manifest-path runtime/Cargo.toml -p trames-vulkan --lib --locked
          fi
          cargo build -p trames-cli --release --locked
          export VK_DRIVER_FILES="$(python3 -c 'from pathlib import Path; print(next(Path("/usr/share/vulkan/icd.d").glob("*lvp*")))')"
          if [[ '${{ needs.scope.outputs.zink_feedback_only }}' != true && '${{ needs.scope.outputs.zink_divisor_only }}' != true ]]; then
