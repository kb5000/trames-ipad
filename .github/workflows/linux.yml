          if [[ '${{ needs.scope.outputs.zink_tf_only }}' == true ]]; then
            : # TF clients execute as independent affected checks below.
          elif [[ '${{ needs.scope.outputs.zink_divisor_only }}' == true ]]; then
            python3 tests/integration/vulkan-divisor.py --store target/zink-native-bundle/store --output target/vulkan-divisor-metal
            python3 tests/integration/zink-es3.py --store target/zink-native-bundle/store --output target/zink-divisor-instancing-metal --stage instancing
            python3 tests/integration/zink-es3.py --store target/zink-native-bundle/store --output target/zink-divisor-capabilities-metal --stage capabilities
            python3 tests/integration/zink-es3.py --store target/zink-native-bundle/store --output target/zink-divisor-es3-metal --stage es3 --capability-probe
          elif [[ '${{ needs.scope.outputs.zink_stencil_only }}' == true ]]; then
            python3 tests/integration/vulkan-stencil.py --store target/zink-native-bundle/store --output target/vulkan-stencil-metal
            python3 tests/integration/zink-es3.py --store target/zink-native-bundle/store --output target/zink-stencil-capabilities-metal --stage capabilities
            python3 tests/integration/zink-es3.py --store target/zink-native-bundle/store --output target/zink-stencil-es3-metal --stage es3 --capability-probe
          elif [[ '${{ needs.scope.outputs.zink_mrt_only }}' == true && '${{ needs.scope.outputs.zink_mesa_only }}' != true ]]; then
            python3 tests/integration/vulkan-feedback.py --store target/zink-native-bundle/store --output target/vulkan-feedback-metal
          fi
      - name: Execute public native Vulkan TF and raster replay
        if: always() && !cancelled() && steps.native_runtime.outcome == 'success' && needs.scope.outputs.zink_tf_only == 'true' && needs.scope.outputs.zink_tf_cache_only != 'true'
        run: |
          command -v glslangValidator >/dev/null || brew install glslang
          native_moltenvk_dir="$(python3 scripts/build-moltenvk.py --platform macos --arch arm64)"
          python3 tests/integration/vulkan-native-tf-runtime.py --include target/vulkan-upstream/headers/Vulkan-Headers-cfebfc96b2b0bce93da7d12f2c14cc01793ae25c/include --shader target/zink-native-bundle/shaders/vulkan-feedback.spv --library "$native_moltenvk_dir/libMoltenVK.a" --output target/vulkan-tf-runtime-metal
      - name: Execute ordinary guest Vulkan and original Mesa GLES3 TF
        if: always() && !cancelled() && steps.native_runtime.outcome == 'success' && needs.scope.outputs.zink_tf_only == 'true' && needs.scope.outputs.zink_tf_cache_only != 'true'
        run: |
          export TRAMES_RUNNER="$PWD/target/release/trames-run"
          export TRAMES_VULKAN_TRACE=1
          python3 tests/integration/vulkan-feedback.py --store target/zink-native-bundle/store --output target/vulkan-feedback-metal --require-feedback
          python3 tests/integration/zink-es3.py --store target/zink-native-bundle/store --output target/zink-tf-es3-metal --stage es3
      - name: Compile corrected native iOS driver without packaging an app
        if: success() || (!cancelled() && needs.scope.outputs.zink_tf_only == 'true')
        run: python3 scripts/build-moltenvk.py --platform ios --arch arm64 > target/zink-metal-native/ios-driver-dir.txt
      - uses: actions/cache/save@v4
        if: always() && steps.native_driver_cache_macos.outputs.cache-hit != 'true'
        with:
          path: |
            target/moltenvk-patched/macos-arm64-*/libMoltenVK.a
            target/moltenvk-patched/macos-arm64-*/build.json
          key: ${{ runner.os }}-moltenvk-macos-v1-${{ hashFiles('scripts/vulkan-upstream.json', 'scripts/build-moltenvk.py', 'patches/moltenvk/**', 'runtime/crates/trames-vulkan/native/transform-feedback/**') }}
      - uses: actions/cache/save@v4
        if: always() && steps.native_driver_cache_ios.outputs.cache-hit != 'true'
        with:
          path: |
            target/moltenvk-patched/ios-arm64-*/libMoltenVK.a
            target/moltenvk-patched/ios-arm64-*/build.json
          key: ${{ runner.os }}-moltenvk-ios-v1-${{ hashFiles('scripts/vulkan-upstream.json', 'scripts/build-moltenvk.py', 'patches/moltenvk/**', 'runtime/crates/trames-vulkan/native/transform-feedback/**') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zink-metal-evidence
          path: |
            target/zink-metal/
            target/zink-metal-native/
            target/zink-es3-metal/
            target/vulkan-feedback-metal/
            target/vulkan-stencil-metal/
            target/vulkan-divisor-metal/
            target/zink-divisor-instancing-metal/
            target/zink-divisor-capabilities-metal/
            target/zink-divisor-es3-metal/
            target/zink-stencil-capabilities-metal/
            target/zink-stencil-es3-metal/
            target/zink-tf-es3-metal/
            target/vulkan-tf-runtime-metal/
            target/vulkan-tf-cache-metal/
            target/zink-native-bundle/checksums.json
            target/moltenvk-patched/*/build.json
            target/moltenvk-patched/*/xcodebuild.log
          retention-days: 14
  runtime-fastpaths:
    needs: scope
    if: needs.scope.outputs.native_scope == 'runtime-fastpaths' && needs.scope.outputs.runtime_linux_reused != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
          components: rustfmt, clippy
      - name: Check affected VFS and scheduling paths
        run: |
          cargo fmt --all --check
          cargo clippy -p trames-vfs -p trames-core -p trames-linux -p trames-ffi -p trames-cli --all-targets --all-features --locked -- -D warnings
          cargo test -p trames-vfs -p trames-core -p trames-linux --locked
          python3 -m py_compile tests/performance/prepare-coremark.py tests/performance/session-coremark.py tests/performance/session-docker-tty.py
          cc -O2 -shared -fPIC -Wall -Wextra -Werror tests/performance/session-sampler.c -ldl -o /tmp/trames-session-sampler.so
          cc -O2 -shared -fPIC -Wall -Wextra -Werror tests/performance/disk-io-counts.c -ldl -pthread -o /tmp/trames-disk-counts.so
          cc -O2 -Wall -Wextra -Werror tests/fixtures/disk-read-cost.c -pthread -o /tmp/trames-read-cost-oracle
          python3 -m py_compile tests/performance/epoch-services.py tests/integration/epoch-services.py
          bash -n scripts/build-epoch-services-fixture.sh
          cc -O2 -Wall -Wextra -Werror -DTRAMES_HOST_ORACLE tests/fixtures/epoch-services.c -pthread -o /tmp/trames-epoch-oracle
      - name: Validate production multiple-terminal control and cancellation
        run: |
          cargo build -p trames-ffi --release --locked
          mkdir -p target/alpine-download
          curl --fail --location --max-time 120 https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/aarch64/alpine-minirootfs-3.22.6-aarch64.tar.gz -o target/alpine-download/alpine-minirootfs-3.22.6-aarch64.tar.gz
          python3 tests/integration/multiple-terminals.py
  release-core:
