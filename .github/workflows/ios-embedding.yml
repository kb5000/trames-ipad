name: iOS embedding
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ios-embedding.yml', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'runtime', 'runtime-version.json']
  pull_request:
    paths: ['.github/workflows/ios-embedding.yml', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'runtime', 'runtime-version.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-embedding-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-16
          targets: aarch64-apple-ios
      - name: Verify the Apple native build tools and device SDK
        run: xcrun --sdk iphoneos --show-sdk-path
      - name: Build the source-checked guest CLI
        run: python3 runtime/scripts/build-guest-cli.py
      - name: Compile core and both network backends with the iOS native dependencies
        run: SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)" cargo check -p trames-core -p trames-distro -p trames-ffi --target aarch64-apple-ios --locked
